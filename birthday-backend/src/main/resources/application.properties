spring.application.name=birthday-app

# Listen on Render's dynamic $PORT (falls back to 8080 locally)
server.port=${PORT:8080}

app.email.script-url=${APP_EMAIL_SCRIPT_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cron.secret=${APP_CRON_SECRET}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL}